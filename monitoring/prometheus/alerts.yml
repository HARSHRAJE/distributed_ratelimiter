groups:
  - name: service-availability
    rules:
      - alert: GatewayScrapeTargetDown
        expr: up{job="gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Gateway metrics endpoint is unavailable
          description: Prometheus has failed to scrape the Gateway for one minute.

      - alert: PolicyServiceScrapeTargetDown
        expr: up{job="policy-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Policy Service metrics endpoint is unavailable
          description: Prometheus has failed to scrape Policy Service for one minute.

      - alert: OrdersServiceScrapeTargetDown
        expr: up{job="orders-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Orders Service metrics endpoint is unavailable
          description: Prometheus has failed to scrape Orders Service for one minute.

      - alert: RedisUnavailable
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis exporter cannot reach Redis
          description: Redis exporter reports that Redis is unavailable.

      - alert: RedisMemoryNearLimit
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis is nearing its configured memory limit
          description: Redis uses more than 85% of its memory budget. With noeviction enabled, writes will fail closed rather than evict active rate-limit state.

      - alert: RedisEvictedKeys
        expr: increase(redis_evicted_keys_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Redis evicted keys
          description: Redis reports key eviction; investigate memory policy and enforcement state immediately.

      - alert: GatewayPolicyCacheNearLimit
        expr: ratelimit_policy_cache_size / ratelimit_policy_cache_maximum > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Gateway policy cache is nearing its configured bound
          description: Cache churn or cardinality may be increasing policy lookups to Redis.

      - alert: GatewayObservedStalePolicyUpdate
        expr: increase(ratelimit_policy_cache_stale_update_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Gateway rejected an older policy snapshot
          description: A Redis policy read was older than the local versioned cache entry and was not used for enforcement.

  - name: policy-synchronization
    rules:
      - alert: PolicyOutboxEventsFailed
        expr: policy_outbox_failed > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Policy outbox has exhausted events
          description: One or more reconciliation events exhausted their retry limit.

      - alert: PolicyOutboxBacklogGrowing
        expr: delta(policy_outbox_pending[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Policy outbox pending backlog is growing
          description: Pending reconciliation events have increased over the last ten minutes.

      - alert: PolicySyncLagHigh
        expr: policy_outbox_sync_lag > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Policy reconciliation is delayed
          description: The oldest pending outbox event is more than five minutes old.

  - name: adaptive-policy-rollback
    rules:
      - alert: AdaptivePolicyRollbackFailed
        expr: increase(ai_controller_rollback_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Adaptive policy rollback failed
          description: A rollback did not complete safely; adaptive control remains paused for operator review.

      - alert: AdaptiveControlCircuitBreakerOpen
        expr: ai_controller_circuit_breaker_state{state="OPEN"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Adaptive control is blocked by its circuit breaker
          description: The durable circuit breaker is OPEN for service {{ $labels.service_key }}; the current Gateway policy remains in effect.
