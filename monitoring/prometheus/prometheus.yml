global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9180"]
        labels:
          application: rate-limiter-gateway

  - job_name: policy-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9181"]
        labels:
          application: policy-service

  - job_name: orders-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9182"]
        labels:
          application: orders-service

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: ai-controller
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-controller-forecast-worker:8001"]

  - job_name: ai-controller-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-controller-worker:8002"]
