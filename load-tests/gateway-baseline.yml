server:
  port: 8085
  address: 127.0.0.1

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders-service-root-baseline
              uri: ${ORDERS_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/orders
            - id: orders-service-baseline
              uri: ${ORDERS_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/orders/**
            - id: auth-service-baseline
              uri: ${AUTH_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/**
