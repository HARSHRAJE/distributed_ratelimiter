spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rate_limiter}
    username: ${DB_USERNAME:rate_limiter_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8083

auth:
  admin:
    bootstrap-token: ${AUTH_ADMIN_BOOTSTRAP_TOKEN:}
  jwt:
    issuer: ${AUTH_ISSUER:http://localhost:8083}
    audience: ${AUTH_AUDIENCE:rate-limiter-api}
    access-token-ttl: 15m
    private-key-location: ${AUTH_PRIVATE_KEY_LOCATION:file:./keys/auth-private.pem}
    public-key-location: ${AUTH_PUBLIC_KEY_LOCATION:file:./keys/auth-public.pem}
  refresh-token:
    ttl: 7d
    cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
  login:
    max-failed-attempts: 5
    lock-duration: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
