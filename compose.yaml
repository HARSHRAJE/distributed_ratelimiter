
services:
  redis:
    image: redis:7.4
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rate_limiter
      POSTGRES_USER: rate_limiter_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rate_limiter_app -d rate_limiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis-exporter

  ai-controller-api:
    build:
      context: ./ai-controller
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      AI_CONTROLLER_API_KEY: ${AI_CONTROLLER_API_KEY:-}
      AI_CONTROLLER_GIT_COMMIT: ${AI_CONTROLLER_GIT_COMMIT:-UNSPECIFIED}
      AI_CONTROLLER_BENCHMARK_MAX_RPS: ${AI_CONTROLLER_BENCHMARK_MAX_RPS:-100}
      AI_CONTROLLER_BENCHMARK_MAX_DURATION_SECONDS: ${AI_CONTROLLER_BENCHMARK_MAX_DURATION_SECONDS:-3600}
      AI_CONTROLLER_SERVICE_KEYS: ${AI_CONTROLLER_SERVICE_KEYS:-orders-service}
      AI_CONTROLLER_COLLECTION_INTERVAL_SECONDS: ${AI_CONTROLLER_COLLECTION_INTERVAL_SECONDS:-15}
      AI_CONTROLLER_STALE_AFTER_SECONDS: ${AI_CONTROLLER_STALE_AFTER_SECONDS:-60}
      AI_CONTROLLER_AGGREGATION_WINDOW_SECONDS: ${AI_CONTROLLER_AGGREGATION_WINDOW_SECONDS:-300}
      AI_CONTROLLER_POLICY_SERVICE_URL: ${AI_CONTROLLER_POLICY_SERVICE_URL:-http://host.docker.internal:8081}
      AI_CONTROLLER_POLICY_SERVICE_API_KEY: ${POLICY_EXECUTION_API_KEY:-}
      AI_CONTROLLER_ADMIN_API_KEY: ${AI_CONTROLLER_ADMIN_API_KEY:-}
      AI_CONTROLLER_ROLLBACK_P95_THRESHOLD_MS: ${AI_CONTROLLER_ROLLBACK_P95_THRESHOLD_MS:-500}
      AI_CONTROLLER_ROLLBACK_P95_CONSECUTIVE_WINDOWS: ${AI_CONTROLLER_ROLLBACK_P95_CONSECUTIVE_WINDOWS:-3}
      AI_CONTROLLER_ROLLBACK_5XX_THRESHOLD_PERCENT: ${AI_CONTROLLER_ROLLBACK_5XX_THRESHOLD_PERCENT:-5}
      AI_CONTROLLER_ROLLBACK_5XX_CONSECUTIVE_WINDOWS: ${AI_CONTROLLER_ROLLBACK_5XX_CONSECUTIVE_WINDOWS:-2}
      AI_CONTROLLER_ROLLBACK_CRITICAL_5XX_PERCENT: ${AI_CONTROLLER_ROLLBACK_CRITICAL_5XX_PERCENT:-20}
      AI_CONTROLLER_ROLLBACK_CPU_THRESHOLD_PERCENT: ${AI_CONTROLLER_ROLLBACK_CPU_THRESHOLD_PERCENT:-90}
      AI_CONTROLLER_ROLLBACK_CPU_CONSECUTIVE_WINDOWS: ${AI_CONTROLLER_ROLLBACK_CPU_CONSECUTIVE_WINDOWS:-3}
      AI_CONTROLLER_ROLLBACK_QUEUE_DEPTH_THRESHOLD: ${AI_CONTROLLER_ROLLBACK_QUEUE_DEPTH_THRESHOLD:-100}
      AI_CONTROLLER_ROLLBACK_QUEUE_GROWTH_WINDOWS: ${AI_CONTROLLER_ROLLBACK_QUEUE_GROWTH_WINDOWS:-3}
      AI_CONTROLLER_ROLLBACK_THROUGHPUT_DROP_PERCENT: ${AI_CONTROLLER_ROLLBACK_THROUGHPUT_DROP_PERCENT:-30}
      AI_CONTROLLER_ROLLBACK_THROUGHPUT_CONSECUTIVE_WINDOWS: ${AI_CONTROLLER_ROLLBACK_THROUGHPUT_CONSECUTIVE_WINDOWS:-3}
      AI_CONTROLLER_ROLLBACK_OBSERVATION_PERIOD_SECONDS: ${AI_CONTROLLER_ROLLBACK_OBSERVATION_PERIOD_SECONDS:-60}
      AI_CONTROLLER_ROLLBACK_REDIS_SYNC_TIMEOUT_SECONDS: ${AI_CONTROLLER_ROLLBACK_REDIS_SYNC_TIMEOUT_SECONDS:-60}
      AI_CONTROLLER_ROLLBACK_COOLDOWN_SECONDS: ${AI_CONTROLLER_ROLLBACK_COOLDOWN_SECONDS:-3600}
      AI_CONTROLLER_ROLLBACK_MAX_ATTEMPTS_PER_HOUR: ${AI_CONTROLLER_ROLLBACK_MAX_ATTEMPTS_PER_HOUR:-2}
      AI_CONTROLLER_ROLLBACK_MINIMUM_HEALTHY_WINDOWS: ${AI_CONTROLLER_ROLLBACK_MINIMUM_HEALTHY_WINDOWS:-5}
      AI_CONTROLLER_ROLLBACK_TELEMETRY_MAX_AGE_SECONDS: ${AI_CONTROLLER_ROLLBACK_TELEMETRY_MAX_AGE_SECONDS:-60}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-rate_limiter}
      DB_USERNAME: ${POSTGRES_USER:-rate_limiter_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-controller-worker:
    build:
      context: ./ai-controller
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler.collection_scheduler"]
    environment:
      AI_CONTROLLER_PROMETHEUS_URL: http://prometheus:9090
      AI_CONTROLLER_SERVICE_KEYS: ${AI_CONTROLLER_SERVICE_KEYS:-orders-service}
      AI_CONTROLLER_COLLECTION_INTERVAL_SECONDS: ${AI_CONTROLLER_COLLECTION_INTERVAL_SECONDS:-15}
      AI_CONTROLLER_STALE_AFTER_SECONDS: ${AI_CONTROLLER_STALE_AFTER_SECONDS:-60}
      AI_CONTROLLER_AGGREGATION_WINDOW_SECONDS: ${AI_CONTROLLER_AGGREGATION_WINDOW_SECONDS:-300}
      AI_CONTROLLER_POLICY_SERVICE_URL: ${AI_CONTROLLER_POLICY_SERVICE_URL:-http://host.docker.internal:8081}
      AI_CONTROLLER_POLICY_SERVICE_API_KEY: ${POLICY_EXECUTION_API_KEY:-}
      AI_CONTROLLER_ROLLBACK_P95_THRESHOLD_MS: ${AI_CONTROLLER_ROLLBACK_P95_THRESHOLD_MS:-500}
      AI_CONTROLLER_ROLLBACK_P95_CONSECUTIVE_WINDOWS: ${AI_CONTROLLER_ROLLBACK_P95_CONSECUTIVE_WINDOWS:-3}
      AI_CONTROLLER_ROLLBACK_5XX_THRESHOLD_PERCENT: ${AI_CONTROLLER_ROLLBACK_5XX_THRESHOLD_PERCENT:-5}
      AI_CONTROLLER_ROLLBACK_5XX_CONSECUTIVE_WINDOWS: ${AI_CONTROLLER_ROLLBACK_5XX_CONSECUTIVE_WINDOWS:-2}
      AI_CONTROLLER_ROLLBACK_CRITICAL_5XX_PERCENT: ${AI_CONTROLLER_ROLLBACK_CRITICAL_5XX_PERCENT:-20}
      AI_CONTROLLER_ROLLBACK_CPU_THRESHOLD_PERCENT: ${AI_CONTROLLER_ROLLBACK_CPU_THRESHOLD_PERCENT:-90}
      AI_CONTROLLER_ROLLBACK_CPU_CONSECUTIVE_WINDOWS: ${AI_CONTROLLER_ROLLBACK_CPU_CONSECUTIVE_WINDOWS:-3}
      AI_CONTROLLER_ROLLBACK_QUEUE_DEPTH_THRESHOLD: ${AI_CONTROLLER_ROLLBACK_QUEUE_DEPTH_THRESHOLD:-100}
      AI_CONTROLLER_ROLLBACK_QUEUE_GROWTH_WINDOWS: ${AI_CONTROLLER_ROLLBACK_QUEUE_GROWTH_WINDOWS:-3}
      AI_CONTROLLER_ROLLBACK_THROUGHPUT_DROP_PERCENT: ${AI_CONTROLLER_ROLLBACK_THROUGHPUT_DROP_PERCENT:-30}
      AI_CONTROLLER_ROLLBACK_THROUGHPUT_CONSECUTIVE_WINDOWS: ${AI_CONTROLLER_ROLLBACK_THROUGHPUT_CONSECUTIVE_WINDOWS:-3}
      AI_CONTROLLER_ROLLBACK_OBSERVATION_PERIOD_SECONDS: ${AI_CONTROLLER_ROLLBACK_OBSERVATION_PERIOD_SECONDS:-60}
      AI_CONTROLLER_ROLLBACK_REDIS_SYNC_TIMEOUT_SECONDS: ${AI_CONTROLLER_ROLLBACK_REDIS_SYNC_TIMEOUT_SECONDS:-60}
      AI_CONTROLLER_ROLLBACK_COOLDOWN_SECONDS: ${AI_CONTROLLER_ROLLBACK_COOLDOWN_SECONDS:-3600}
      AI_CONTROLLER_ROLLBACK_MAX_ATTEMPTS_PER_HOUR: ${AI_CONTROLLER_ROLLBACK_MAX_ATTEMPTS_PER_HOUR:-2}
      AI_CONTROLLER_ROLLBACK_MINIMUM_HEALTHY_WINDOWS: ${AI_CONTROLLER_ROLLBACK_MINIMUM_HEALTHY_WINDOWS:-5}
      AI_CONTROLLER_ROLLBACK_TELEMETRY_MAX_AGE_SECONDS: ${AI_CONTROLLER_ROLLBACK_TELEMETRY_MAX_AGE_SECONDS:-60}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-rate_limiter}
      DB_USERNAME: ${POSTGRES_USER:-rate_limiter_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started

  ai-controller-forecast-worker:
    build:
      context: ./ai-controller
    restart: unless-stopped
    command: ["python", "-m", "app.forecasting.forecast_scheduler"]
    environment:
      AI_CONTROLLER_SERVICE_KEYS: ${AI_CONTROLLER_SERVICE_KEYS:-orders-service}
      AI_CONTROLLER_COLLECTION_INTERVAL_SECONDS: ${AI_CONTROLLER_COLLECTION_INTERVAL_SECONDS:-15}
      AI_CONTROLLER_STALE_AFTER_SECONDS: ${AI_CONTROLLER_STALE_AFTER_SECONDS:-60}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-rate_limiter}
      DB_USERNAME: ${POSTGRES_USER:-rate_limiter_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  ai-controller-benchmark-worker:
    profiles: ["benchmark"]
    build:
      context: ./ai-controller
    restart: unless-stopped
    command: ["python", "-m", "app.benchmarking.benchmark_worker"]
    environment:
      AI_CONTROLLER_PROMETHEUS_URL: http://prometheus:9090
      AI_CONTROLLER_SERVICE_KEYS: ${AI_CONTROLLER_SERVICE_KEYS:-orders-service}
      AI_CONTROLLER_BENCHMARK_TARGET_URL: ${AI_CONTROLLER_BENCHMARK_TARGET_URL:-}
      AI_CONTROLLER_BENCHMARK_ALLOWED_HOSTS: ${AI_CONTROLLER_BENCHMARK_ALLOWED_HOSTS:-localhost:8080,host.docker.internal:8080,gateway:8080}
      AI_CONTROLLER_BENCHMARK_ROUTE_PATHS: ${AI_CONTROLLER_BENCHMARK_ROUTE_PATHS:-/}
      AI_CONTROLLER_BENCHMARK_K6_BINARY: ${AI_CONTROLLER_BENCHMARK_K6_BINARY:-k6}
      AI_CONTROLLER_BENCHMARK_WORKER_POLL_SECONDS: ${AI_CONTROLLER_BENCHMARK_WORKER_POLL_SECONDS:-2}
      AI_CONTROLLER_BENCHMARK_MAX_DURATION_SECONDS: ${AI_CONTROLLER_BENCHMARK_MAX_DURATION_SECONDS:-3600}
      AI_CONTROLLER_BENCHMARK_MAX_RPS: ${AI_CONTROLLER_BENCHMARK_MAX_RPS:-100}
      AI_CONTROLLER_BENCHMARK_TENANT_TOKENS: ${AI_CONTROLLER_BENCHMARK_TENANT_TOKENS:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-rate_limiter}
      DB_USERNAME: ${POSTGRES_USER:-rate_limiter_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
