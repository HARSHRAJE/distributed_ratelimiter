server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: rate-limiter-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:gateway}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: ${REDIS_COMMAND_TIMEOUT:100ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:100}
          max-idle: ${REDIS_POOL_MAX_IDLE:30}
          min-idle: ${REDIS_POOL_MIN_IDLE:10}
          max-wait: ${REDIS_POOL_MAX_WAIT:100ms}
          time-between-eviction-runs: 30s

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}
            pool:
              type: fixed
              max-connections: ${GATEWAY_MAX_CONNECTIONS:500}
              acquire-timeout: ${GATEWAY_POOL_ACQUIRE_TIMEOUT_MS:1000}
              max-idle-time: 30s
              max-life-time: 5m
          routes:
            - id: orders-service-root
              uri: ${ORDERS_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/orders
              filters:
                - name: RateLimit
                  args:
                    serviceKey: orders-service
                    routeMappings:
                      - GET|/api/orders|get-orders
                      - POST|/api/orders|create-order
            - id: orders-service
              uri: ${ORDERS_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/orders/**
              filters:
                - name: RateLimit
                  args:
                    serviceKey: orders-service
                    routeMappings:
                      - GET|/api/orders/**|get-orders
                      - POST|/api/orders/**|create-order
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/**
            - id: policy-services-api
              uri: ${POLICY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/services,/api/v1/services/**
            - id: policy-policies-api
              uri: ${POLICY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/policies,/api/v1/policies/**
            - id: ai-controller-api
              uri: ${AI_CONTROLLER_URI:http://localhost:8000}
              predicates:
                - Path=/ai-controller,/ai-controller/**
              filters:
                - StripPrefix=1

security:
  jwt:
    public-key-location: ${AUTH_PUBLIC_KEY_LOCATION:file:./keys/auth-public.pem}
    issuer: ${AUTH_ISSUER:http://localhost:8083}
    audience: ${AUTH_AUDIENCE:rate-limiter-api}

gateway:
  rate-limit:
    policy-cache-ttl: ${RATE_LIMIT_POLICY_CACHE_TTL:1s}
    policy-cache-max-entries: ${RATE_LIMIT_POLICY_CACHE_MAX_ENTRIES:100000}

management:
  server:
    port: 9180
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
